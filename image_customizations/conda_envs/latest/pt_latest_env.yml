      # - azure-storage-blob 
      # - azure-ai-ml
      # - azure-identity
      # - azureml-core
      # - azureml-sdk 
      # - azureml-fsspec
      # - mltable 
      # - pymongo
      # Other must-haves
      - ipykernel
      - tqdm
      # Good to haves
        # dask
      - tensorboard
      - seaborn 
      - plotly 
      - pandas-profiling 
      - nodejs 
      - pipreqs 